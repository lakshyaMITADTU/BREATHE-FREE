<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AeroVe - Split Screen Auth</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Inter', 'sans-serif'] }
      }
    }
  }
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="selection:bg-teal-500/30 overflow-hidden relative min-h-screen w-full flex flex-col md:flex-row bg-[#050505] text-white">

<!-- GLOBAL NOISE / GRAIN EFFECT -->
<div class="pointer-events-none fixed inset-0 z-50 opacity-[0.035] mix-blend-overlay" style="background-image: url(&quot;data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E&quot;)"></div>

<!-- GLOBAL VIGNETTE -->
<div class="pointer-events-none fixed inset-0 z-40 bg-[radial-gradient(circle_at_center,transparent_40%,rgba(0,0,0,0.4)_100%)]"></div>

<!-- LEFT PANEL - CONTENT -->
<div class="w-full md:w-1/2 relative overflow-hidden min-h-[50vh] md:min-h-screen flex flex-col items-center justify-center p-8 lg:p-12 z-0">
  
  <!-- Interactive Radial Glows -->
  <div id="radialGlow" class="absolute top-[50%] left-[50%] -translate-x-[50%] -translate-y-[50%] w-[120%] h-[120%] bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-teal-500/30 via-[#050505]/95 to-[#050505] pointer-events-none z-[-1]" style="opacity: 0.5;"></div>
  
  <div id="coreGlow" class="absolute top-[40%] left-[50%] -translate-x-[50%] -translate-y-[50%] w-[60%] h-[60%] bg-teal-400/30 blur-[130px] rounded-full pointer-events-none z-[-1]" style="opacity: 0.5; transform: translate(-50%, -50%) scale(1);"></div>

  <div id="leftContent" class="w-full max-w-lg lg:max-w-xl flex flex-col items-center text-center relative z-10 transition-transform duration-75">
    <!-- Brand Logo -->
    <div class="flex items-center gap-3 mb-10">
      <div class="w-6 h-6 rounded-full border-[3px] border-white"></div>
      <span class="text-2xl font-bold tracking-tight text-white drop-shadow-sm">AeroVe</span>
    </div>

    <h1 class="text-5xl lg:text-6xl font-extrabold mb-6 tracking-tight text-white drop-shadow-md leading-tight">Get Started with Us</h1>
    <p class="text-gray-300 text-lg lg:text-xl mb-12 max-w-md font-medium tracking-wide">Complete these easy steps to register your account.</p>

    <!-- Step Cards -->
    <div class="flex flex-col gap-3 w-full max-w-[340px]">
      <div class="flex items-center gap-4 p-4 rounded-xl transition-all duration-300 bg-white shadow-[0_0_30px_rgba(255,255,255,0.05)] text-black">
        <div class="flex items-center justify-center w-5 h-5 rounded-full text-[10px] font-extrabold shrink-0 bg-black text-white">1</div>
        <span class="text-sm font-semibold tracking-wide text-black">Sign up your account</span>
      </div>
      <div class="flex items-center gap-4 p-4 rounded-xl transition-all duration-300 bg-white/5 border border-white/[0.04] hover:bg-white/10 text-white">
        <div class="flex items-center justify-center w-5 h-5 rounded-full text-[10px] font-extrabold shrink-0 bg-white/10 text-white/50">2</div>
        <span class="text-sm font-semibold tracking-wide text-gray-300">Set up your workspace</span>
      </div>
      <div class="flex items-center gap-4 p-4 rounded-xl transition-all duration-300 bg-white/5 border border-white/[0.04] hover:bg-white/10 text-white">
        <div class="flex items-center justify-center w-5 h-5 rounded-full text-[10px] font-extrabold shrink-0 bg-white/10 text-white/50">3</div>
        <span class="text-sm font-semibold tracking-wide text-gray-300">Set up your profile</span>
      </div>
    </div>
  </div>
</div>

<!-- RIGHT PANEL - FORM -->
<div class="w-full md:w-1/2 flex flex-col items-center pt-24 lg:pt-32 px-6 sm:px-8 lg:px-16 pb-16 relative bg-[#050505] overflow-hidden">
  <div class="absolute top-[20%] right-[-10%] w-[40%] h-[40%] rounded-full bg-white/5 blur-[120px] pointer-events-none"></div>

  <div id="rightContent" class="w-full max-w-lg lg:max-w-xl relative perspective-[1200px] z-10 transition-transform duration-75">
    <div class="w-full relative transform-gpu">
      <h2 class="text-5xl lg:text-6xl font-extrabold mb-6 tracking-tight text-white drop-shadow-md leading-tight">Sign Up Account</h2>
      <p class="text-gray-400/80 text-lg lg:text-xl mb-12 font-medium tracking-wide">Enter your personal data to create your account</p>

      <div class="flex gap-5 mb-10">
        <!-- Google Button -->
        <button class="flex-1 flex items-center justify-center gap-3 py-4 px-6 rounded-xl bg-white/5 hover:bg-white/10 border border-white/5 hover:border-white/10 transition-all duration-300 text-base font-semibold shadow-inner group relative overflow-hidden">
          <div class="absolute inset-0 rounded-xl bg-white/0 group-hover:bg-white/5 transition-colors pointer-events-none"></div>
          <svg class="w-6 h-6 drop-shadow-sm" viewBox="0 0 24 24"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" /><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" /><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" /><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" /></svg>
          <span class="relative z-10">Google</span>
        </button>
        <!-- Apple Button -->
        <button class="flex-1 flex items-center justify-center gap-3 py-4 px-6 rounded-xl bg-white/5 hover:bg-white/10 border border-white/5 hover:border-white/10 transition-all duration-300 text-base font-semibold shadow-inner group relative overflow-hidden">
          <div class="absolute inset-0 rounded-xl bg-white/0 group-hover:bg-white/5 transition-colors pointer-events-none"></div>
          <svg class="w-5 h-5 text-white drop-shadow-sm mb-0.5" viewBox="0 0 384 512" fill="currentColor">
            <path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/>
          </svg>
          <span class="relative z-10">Apple</span>
        </button>
      </div>

      <div class="relative flex items-center mb-10">
        <div class="flex-grow border-t border-white/5"></div>
        <span class="flex-shrink-0 mx-4 text-xs font-bold text-gray-600 uppercase tracking-widest">Or</span>
        <div class="flex-grow border-t border-white/5"></div>
      </div>

      <form onsubmit="handleFormSubmit(event)" class="space-y-4">
        <div class="flex gap-5">
          <div class="space-y-2 flex-1 relative group">
            <label class="text-sm font-semibold text-gray-400 uppercase tracking-wider pl-1">First Name</label>
            <input type="text" placeholder="John" class="w-full bg-[#0a0a0a]/60 backdrop-blur-sm border border-white/10 rounded-xl px-5 py-4 text-base focus:outline-none focus:border-teal-400 focus:ring-1 focus:ring-teal-400/50 focus:shadow-[0_0_20px_rgba(45,212,191,0.2)] transition-all duration-300 text-white placeholder-gray-500 shadow-inner" />
          </div>
          <div class="space-y-2 flex-1 relative group">
            <label class="text-sm font-semibold text-gray-400 uppercase tracking-wider pl-1">Last Name</label>
            <input type="text" placeholder="Doe" class="w-full bg-[#0a0a0a]/60 backdrop-blur-sm border border-white/10 rounded-xl px-5 py-4 text-base focus:outline-none focus:border-teal-400 focus:ring-1 focus:ring-teal-400/50 focus:shadow-[0_0_20px_rgba(45,212,191,0.2)] transition-all duration-300 text-white placeholder-gray-500 shadow-inner" />
          </div>
        </div>

        <div class="space-y-2 relative group mt-6">
          <label class="text-sm font-semibold text-gray-400 uppercase tracking-wider pl-1">Email</label>
          <input type="email" placeholder="john.doe@example.com" class="w-full bg-[#0a0a0a]/60 backdrop-blur-sm border border-white/10 rounded-xl px-5 py-4 text-base focus:outline-none focus:border-teal-400 focus:ring-1 focus:ring-teal-400/50 focus:shadow-[0_0_20px_rgba(45,212,191,0.2)] transition-all duration-300 text-white placeholder-gray-500 shadow-inner" />
        </div>

        <div class="space-y-2 relative group mt-6">
          <label class="text-sm font-semibold text-gray-400 uppercase tracking-wider pl-1">Password</label>
          <div class="relative">
            <input type="password" id="passwordInput" placeholder="••••••••" class="w-full bg-[#0a0a0a]/60 backdrop-blur-sm border border-white/10 rounded-xl px-5 py-4 text-base focus:outline-none focus:border-teal-400 focus:ring-1 focus:ring-teal-400/50 focus:shadow-[0_0_20px_rgba(45,212,191,0.2)] transition-all duration-300 text-white placeholder-gray-500 shadow-inner pr-12" />
            <button type="button" id="togglePassword" class="absolute right-5 top-1/2 -translate-y-1/2 text-gray-500 hover:text-white transition-colors duration-300">
              <svg id="eyeIcon" class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="relative w-full overflow-hidden bg-gradient-to-r from-teal-500 to-teal-400 hover:from-teal-400 hover:to-teal-300 text-black font-bold py-5 text-lg rounded-xl shadow-[0_0_20px_rgba(20,184,166,0.3)] hover:shadow-[0_0_35px_rgba(20,184,166,0.6)] transition-all duration-300 mt-10 group">
          <div class="absolute top-0 left-[-100%] w-1/2 h-full bg-gradient-to-r from-transparent via-white/40 to-transparent skew-x-12 group-hover:left-[200%] transition-all duration-1000 ease-in-out"></div>
          <span class="relative z-10 drop-shadow-sm tracking-wide">Sign Up</span>
        </button>
      </form>

      <p class="text-center text-base text-gray-400/80 mt-10 font-medium">
        Already have an account? 
        <button type="button" class="text-teal-400 hover:text-teal-300 font-bold transition-all duration-300 hover:underline hover:drop-shadow-[0_0_8px_rgba(45,212,191,0.5)] cursor-pointer">
          Log in
        </button>
      </p>
    </div>
  </div>
</div>

<script>
// Password Toggle Logic
const togglePassword = document.getElementById('togglePassword');
const passwordInput = document.getElementById('passwordInput');
const eyeIcon = document.getElementById('eyeIcon');
let showPassword = false;

togglePassword.addEventListener('click', () => {
  showPassword = !showPassword;
  passwordInput.type = showPassword ? 'text' : 'password';
  if (showPassword) {
    eyeIcon.innerHTML = `<path d="m2 2 20 20"/><path d="M6.71 6.71C4.6 8.21 3.2 10.3 2 12c3 7 10 7 10 7a18 18 0 0 0 3.73-1.07"/><path d="m14.65 14.65-2.02-2.02a2 2 0 0 1-2.83-2.83l-2.02-2.02"/><path d="M12 5c5 0 8 3 10 7-.5 1.16-1.12 2.21-1.85 3.12"/><path d="M17.3 17.3A11 11 0 0 1 12 19c-5 0-8-3-10-7 1.2-1.7 2.6-3.79 4.71-5.29"/>`;
  } else {
    eyeIcon.innerHTML = `<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>`;
  }
});

// Interactive Parallax Vanilla JS Implementation
const leftContent = document.getElementById('leftContent');
const rightContent = document.getElementById('rightContent');
const radialGlow = document.getElementById('radialGlow');
const coreGlow = document.getElementById('coreGlow');

let targetX = 0;
let targetY = 0;
let smoothX = 0;
let smoothY = 0;

window.addEventListener('mousemove', (e) => {
  targetX = (e.clientX / window.innerWidth) * 2 - 1;
  targetY = (e.clientY / window.innerHeight) * 2 - 1;
});

function animate() {
  // Simple linear interpolation to act as a spring
  smoothX += (targetX - smoothX) * 0.1;
  smoothY += (targetY - smoothY) * 0.1;

  // Left panel parallax
  leftContent.style.transform = `translate(${smoothX * -15}px, ${smoothY * -15}px)`;

  // Right panel 3D tilt
  const rotateX = smoothY * -8;
  const rotateY = smoothX * 8;
  rightContent.style.transform = `perspective(1200px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;

  // Left glow distance calculation
  const distX = smoothX + 0.5;
  const distY = smoothY;
  const dist = Math.sqrt(distX * distX + distY * distY);
  
  const opacity = Math.max(0.3, 1.2 - dist * 0.5);
  const scale = Math.max(0.8, 1.4 - dist * 0.4);

  radialGlow.style.opacity = opacity;
  coreGlow.style.opacity = opacity;
  coreGlow.style.transform = `translate(-50%, -50%) scale(${scale})`;

  requestAnimationFrame(animate);
}

// Start animation loop
animate();

// Form Submission Handler
function handleFormSubmit(event) {
  event.preventDefault();
  // Redirect to join.html after form submit
  window.location.href = '/join.html';
}
</script>
</body>
</html>
