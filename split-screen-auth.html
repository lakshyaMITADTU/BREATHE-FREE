<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Split-Screen Auth</title>
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS (Play CDN for standalone HTML) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            }
          }
        }
      }
    </script>

    <style>
        body {
            margin: 0;
            overflow-x: hidden;
            background-color: #050505;
        }

        /* Continuous floating keyframes for step cards */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }

        .float-animation {
            animation: float 4s ease-in-out infinite;
        }
        
        /* Staggered floating delays */
        .delay-1 { animation-delay: 0s; }
        .delay-2 { animation-delay: 0.5s; }
        .delay-3 { animation-delay: 1s; }

        /* Smooth transition for mouse parallax */
        .smooth-transform {
            transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
    </style>
</head>
<body class="text-white font-sans antialiased selection:bg-teal-500/30">

    <div class="min-h-screen w-full flex flex-col md:flex-row relative">
        
        <!-- GLOBAL NOISE / GRAIN EFFECT -->
        <div 
            class="pointer-events-none fixed inset-0 z-50 opacity-[0.035] mix-blend-overlay"
            style="background-image: url('data:image/svg+xml,%3Csvg viewBox=\'0 0 200 200\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cfilter id=\'noiseFilter\'%3E%3CfeTurbulence type=\'fractalNoise\' baseFrequency=\'0.8\' numOctaves=\'3\' stitchTiles=\'stitch\'/%3E%3C/filter%3E%3Crect width=\'100%25\' height=\'100%25\' filter=\'url(%23noiseFilter)\'/%3E%3C/svg%3E');"
        ></div>

        <!-- GLOBAL VIGNETTE EFFECT -->
        <div class="pointer-events-none fixed inset-0 z-40 bg-[radial-gradient(circle_at_center,transparent_40%,rgba(0,0,0,0.4)_100%)]"></div>

        <!-- LEFT PANEL -->
        <div class="relative w-full md:w-1/2 min-h-[50vh] md:min-h-screen bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-[#115a45] via-[#0f3d2e] to-[#041a13] flex flex-col justify-center p-8 lg:p-16 overflow-hidden">
            
            <!-- Soft atmospheric lighting glows -->
            <div class="absolute top-[-20%] left-[-10%] w-[60%] h-[60%] rounded-full bg-teal-400/10 blur-[120px] mix-blend-screen pointer-events-none"></div>
            <div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] rounded-full bg-[#0b7a6e]/20 blur-[140px] mix-blend-screen pointer-events-none"></div>

            <div id="left-content" class="relative z-10 max-w-xl mx-auto w-full smooth-transform">
                
                <!-- Subtle radial lighting glow behind the main heading -->
                <div class="absolute top-[5%] left-[20%] w-64 h-64 bg-teal-400/15 blur-[80px] pointer-events-none mix-blend-screen"></div>

                <h1 class="text-4xl lg:text-6xl font-extrabold mb-4 tracking-tight leading-tight drop-shadow-xl animate-fade-in-up">
                    Get Started with Us
                </h1>
                <p class="text-teal-50/80 text-lg mb-12 max-w-md font-medium animate-fade-in-up" style="animation-delay: 0.1s;">
                    Complete these easy steps to register your account.
                </p>

                <!-- Step Cards -->
                <div class="flex flex-col xl:flex-row gap-5" style="perspective: 1200px;">
                    
                    <!-- Step 1 (Active) -->
                    <div class="step-card float-animation delay-1 relative p-6 rounded-2xl flex flex-col items-start gap-4 transition-all duration-300 backdrop-blur-xl border flex-1 group bg-white/10 border-white/20 shadow-[0_16px_40px_-10px_rgba(0,0,0,0.4)] hover:scale-105" style="transform-style: preserve-3d;">
                        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-20 h-20 bg-teal-400/30 blur-[40px] pointer-events-none"></div>
                        <div class="absolute top-0 left-0 right-0 h-px bg-gradient-to-r from-transparent via-white/20 to-transparent pointer-events-none rounded-t-2xl opacity-50"></div>
                        
                        <div class="relative flex items-center justify-center w-10 h-10 rounded-full text-sm font-bold shrink-0 shadow-inner bg-teal-400 text-[#0f3d2e] shadow-[0_0_15px_rgba(45,212,191,0.5)]">
                            1
                        </div>
                        <span class="relative font-semibold text-sm leading-tight tracking-wide text-white">
                            Sign up your account
                        </span>
                        
                        <!-- Floating glowing border -->
                        <div class="absolute inset-0 rounded-2xl border border-teal-300/20 pointer-events-none"></div>
                    </div>

                    <!-- Step 2 -->
                    <div class="step-card float-animation delay-2 relative p-6 rounded-2xl flex flex-col items-start gap-4 transition-all duration-300 backdrop-blur-xl border flex-1 group bg-black/10 border-white/5 opacity-70 hover:opacity-100 hover:bg-white/5 hover:border-white/10 hover:scale-105" style="transform-style: preserve-3d;">
                        <div class="absolute top-0 left-0 right-0 h-px bg-gradient-to-r from-transparent via-white/20 to-transparent pointer-events-none rounded-t-2xl opacity-50"></div>
                        
                        <div class="relative flex items-center justify-center w-10 h-10 rounded-full text-sm font-bold shrink-0 shadow-inner bg-white/10 text-white shadow-black/20">
                            2
                        </div>
                        <span class="relative font-semibold text-sm leading-tight tracking-wide text-teal-50/80">
                            Set up your profile
                        </span>
                    </div>

                    <!-- Step 3 -->
                    <div class="step-card float-animation delay-3 relative p-6 rounded-2xl flex flex-col items-start gap-4 transition-all duration-300 backdrop-blur-xl border flex-1 group bg-black/10 border-white/5 opacity-70 hover:opacity-100 hover:bg-white/5 hover:border-white/10 hover:scale-105" style="transform-style: preserve-3d;">
                        <div class="absolute top-0 left-0 right-0 h-px bg-gradient-to-r from-transparent via-white/20 to-transparent pointer-events-none rounded-t-2xl opacity-50"></div>
                        
                        <div class="relative flex items-center justify-center w-10 h-10 rounded-full text-sm font-bold shrink-0 shadow-inner bg-white/10 text-white shadow-black/20">
                            3
                        </div>
                        <span class="relative font-semibold text-sm leading-tight tracking-wide text-teal-50/80">
                            Start your journey
                        </span>
                    </div>

                </div>
            </div>
        </div>

        <!-- RIGHT PANEL -->
        <div class="w-full md:w-1/2 flex items-center justify-center p-6 sm:p-8 lg:p-16 relative bg-[#050505] overflow-hidden">
            
            <!-- Very subtle ambient lighting in background -->
            <div class="absolute top-[20%] right-[-10%] w-[40%] h-[40%] rounded-full bg-white/5 blur-[120px] pointer-events-none"></div>

            <div id="right-card-wrapper" class="w-full max-w-[440px] relative z-10 smooth-transform" style="perspective: 1200px;">
                <!-- Glass Form Container -->
                <div id="right-card" class="bg-[#111111]/60 backdrop-blur-2xl p-8 lg:p-12 rounded-[24px] shadow-[0_30px_60px_-15px_rgba(0,0,0,0.8),0_0_20px_rgba(0,0,0,0.5)] border border-white/10 relative transform-gpu smooth-transform">
                    
                    <!-- Top highlight reflection -->
                    <div class="absolute top-0 left-10 right-10 h-px bg-gradient-to-r from-transparent via-white/20 to-transparent pointer-events-none"></div>
                    
                    <!-- Subtle inner glow -->
                    <div class="absolute inset-0 rounded-[24px] shadow-[inset_0_1px_20px_rgba(255,255,255,0.03)] pointer-events-none"></div>
                    
                    <h2 id="form-heading" class="text-3xl font-extrabold mb-3 tracking-tight text-white drop-shadow-md">Sign Up Account</h2>
                    <p id="form-subheading" class="text-gray-400/80 text-sm mb-10 font-medium tracking-wide">Enter your personal data to create your account</p>

                    <!-- Social Logins -->
                    <div class="flex gap-4 mb-8">
                        <button class="flex-1 flex items-center justify-center gap-2 py-3.5 px-4 rounded-xl bg-white/5 hover:bg-white/10 border border-white/5 hover:border-white/10 transition-all duration-300 text-sm font-semibold shadow-inner group relative overflow-hidden hover:scale-105 active:scale-95">
                            <div class="absolute inset-0 rounded-xl bg-white/0 group-hover:bg-white/5 transition-colors pointer-events-none"></div>
                            <svg class="w-5 h-5 drop-shadow-sm" viewBox="0 0 24 24">
                                <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                            </svg>
                            Google
                        </button>
                        <button class="flex-1 flex items-center justify-center gap-2 py-3.5 px-4 rounded-xl bg-white/5 hover:bg-white/10 border border-white/5 hover:border-white/10 transition-all duration-300 text-sm font-semibold shadow-inner group relative overflow-hidden hover:scale-105 active:scale-95">
                            <div class="absolute inset-0 rounded-xl bg-white/0 group-hover:bg-white/5 transition-colors pointer-events-none"></div>
                            <!-- Lucide Apple Icon SVG -->
                            <svg class="w-5 h-5 text-white drop-shadow-sm" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 20.94c1.5 0 2.75 1.06 4 1.06 3 0 6-8 6-12.22A4.91 4.91 0 0 0 17 5c-2.22 0-4 1.44-5 2-1-.56-2.78-2-5-2a4.9 4.9 0 0 0-5 4.78C2 14 5 22 8 22c1.25 0 2.5-1.06 4-1.06Z"/>
                                <path d="M10 2c1 .5 2 2 2 5"/>
                            </svg>
                            Apple
                        </button>
                    </div>

                    <div class="relative flex items-center mb-8">
                        <div class="flex-grow border-t border-white/5"></div>
                        <span class="flex-shrink-0 mx-4 text-xs font-bold text-gray-600 uppercase tracking-widest">Or</span>
                        <div class="flex-grow border-t border-white/5"></div>
                    </div>

                    <form onsubmit="event.preventDefault();" class="space-y-4">
                        
                        <!-- Name Fields (Hidden on Login) -->
                        <div id="name-fields" class="flex gap-4 transition-all duration-300 overflow-hidden" style="max-height: 100px; opacity: 1;">
                            <div class="space-y-2 flex-1 relative group">
                                <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider pl-1">First Name</label>
                                <input type="text" placeholder="John" class="w-full bg-[#0a0a0a]/50 backdrop-blur-sm border border-white/10 rounded-xl px-4 py-3.5 text-sm focus:outline-none focus:border-teal-400 focus:ring-1 focus:ring-teal-400/50 focus:shadow-[0_0_15px_rgba(45,212,191,0.15)] transition-all duration-300 text-white placeholder-gray-500 shadow-inner" />
                            </div>
                            <div class="space-y-2 flex-1 relative group">
                                <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider pl-1">Last Name</label>
                                <input type="text" placeholder="Doe" class="w-full bg-[#0a0a0a]/50 backdrop-blur-sm border border-white/10 rounded-xl px-4 py-3.5 text-sm focus:outline-none focus:border-teal-400 focus:ring-1 focus:ring-teal-400/50 focus:shadow-[0_0_15px_rgba(45,212,191,0.15)] transition-all duration-300 text-white placeholder-gray-500 shadow-inner" />
                            </div>
                        </div>

                        <!-- Email Field -->
                        <div class="space-y-2 relative group">
                            <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider pl-1">Email</label>
                            <input type="email" placeholder="john.doe@example.com" class="w-full bg-[#0a0a0a]/50 backdrop-blur-sm border border-white/10 rounded-xl px-4 py-3.5 text-sm focus:outline-none focus:border-teal-400 focus:ring-1 focus:ring-teal-400/50 focus:shadow-[0_0_15px_rgba(45,212,191,0.15)] transition-all duration-300 text-white placeholder-gray-500 shadow-inner" />
                        </div>

                        <!-- Password Field -->
                        <div class="space-y-2 relative group">
                            <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider pl-1">Password</label>
                            <div class="relative">
                                <input id="password-input" type="password" placeholder="••••••••" class="w-full bg-[#0a0a0a]/50 backdrop-blur-sm border border-white/10 rounded-xl px-4 py-3.5 text-sm focus:outline-none focus:border-teal-400 focus:ring-1 focus:ring-teal-400/50 focus:shadow-[0_0_15px_rgba(45,212,191,0.15)] transition-all duration-300 text-white placeholder-gray-500 shadow-inner pr-10" />
                                <button type="button" onclick="togglePassword()" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 hover:text-white transition-colors duration-300">
                                    <svg id="eye-icon" class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
                                    </svg>
                                    <svg id="eye-off-icon" class="w-4 h-4 hidden" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/>
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <!-- Primary Button -->
                        <button class="relative w-full overflow-hidden bg-gradient-to-r from-teal-500 to-teal-400 hover:from-teal-400 hover:to-teal-300 text-black font-bold py-4 rounded-xl shadow-[0_0_20px_rgba(20,184,166,0.3)] hover:shadow-[0_0_35px_rgba(20,184,166,0.6)] transition-all duration-300 mt-8 group hover:scale-[1.02] active:scale-95">
                            <div class="absolute top-0 left-[-100%] w-1/2 h-full bg-gradient-to-r from-transparent via-white/40 to-transparent skew-x-12 group-hover:left-[200%] transition-all duration-1000 ease-in-out"></div>
                            <span id="primary-btn-text" class="relative z-10 drop-shadow-sm">Sign Up</span>
                        </button>
                    </form>

                    <!-- Footer Toggle -->
                    <p class="text-center text-sm text-gray-400/80 mt-8 font-medium">
                        <span id="footer-text">Already have an account? </span>
                        <button type="button" onclick="toggleAuthMode()" id="toggle-btn" class="text-teal-400 hover:text-teal-300 font-bold transition-all duration-300 hover:underline hover:drop-shadow-[0_0_8px_rgba(45,212,191,0.5)] cursor-pointer">
                            Log in
                        </button>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Interactivity Script -->
    <script>
        // Smooth Mouse Parallax
        const leftContent = document.getElementById('left-content');
        const rightCard = document.getElementById('right-card');
        const rightCardWrapper = document.getElementById('right-card-wrapper');

        // Simple interpolation for smooth animations
        let currentMouseX = 0;
        let currentMouseY = 0;
        let targetMouseX = 0;
        let targetMouseY = 0;

        document.addEventListener('mousemove', (e) => {
            targetMouseX = (e.clientX / window.innerWidth) * 2 - 1;
            targetMouseY = (e.clientY / window.innerHeight) * 2 - 1;
        });

        function animateParallax() {
            // Lerp (smooth interpolation)
            currentMouseX += (targetMouseX - currentMouseX) * 0.1;
            currentMouseY += (targetMouseY - currentMouseY) * 0.1;

            // Apply transforms
            if (leftContent) {
                leftContent.style.transform = `translate(${currentMouseX * -15}px, ${currentMouseY * -15}px)`;
            }
            if (rightCard) {
                // 3D Tilt calculation
                const rotateX = currentMouseY * -8;
                const rotateY = currentMouseX * 8;
                rightCard.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            }

            // Step card hover titles
            const stepCards = document.querySelectorAll('.step-card');
            stepCards.forEach(card => {
                if(card.matches(':hover')) {
                    card.style.transform = `rotateX(8deg) rotateY(-8deg) scale(1.04) translateZ(30px)`;
                } else {
                    card.style.transform = `rotateX(0) rotateY(0) scale(1) translateZ(0)`;
                }
            });

            requestAnimationFrame(animateParallax);
        }
        animateParallax();

        // Password Visibility Toggle
        let showPassword = false;
        function togglePassword() {
            showPassword = !showPassword;
            const input = document.getElementById('password-input');
            const eyeIcon = document.getElementById('eye-icon');
            const eyeOffIcon = document.getElementById('eye-off-icon');

            if (showPassword) {
                input.type = "text";
                eyeIcon.classList.add('hidden');
                eyeOffIcon.classList.remove('hidden');
            } else {
                input.type = "password";
                eyeIcon.classList.remove('hidden');
                eyeOffIcon.classList.add('hidden');
            }
        }

        // Auth Mode Toggle (Login vs Sign Up)
        let isLogin = false;
        function toggleAuthMode() {
            isLogin = !isLogin;
            
            const heading = document.getElementById('form-heading');
            const subheading = document.getElementById('form-subheading');
            const nameFields = document.getElementById('name-fields');
            const btnText = document.getElementById('primary-btn-text');
            const footerText = document.getElementById('footer-text');
            const toggleBtn = document.getElementById('toggle-btn');

            if (isLogin) {
                heading.innerText = 'Welcome Back';
                subheading.innerText = 'Enter your details to access your dashboard';
                btnText.innerText = 'Sign In';
                footerText.innerText = "Don't have an account? ";
                toggleBtn.innerText = "Sign up";
                
                nameFields.style.opacity = '0';
                nameFields.style.maxHeight = '0px';
                nameFields.style.marginTop = '0px';
            } else {
                heading.innerText = 'Sign Up Account';
                subheading.innerText = 'Enter your personal data to create your account';
                btnText.innerText = 'Sign Up';
                footerText.innerText = 'Already have an account? ';
                toggleBtn.innerText = 'Log in';
                
                nameFields.style.opacity = '1';
                nameFields.style.maxHeight = '100px';
                nameFields.style.marginTop = '1rem';
            }
        }

        // Add page load animations dynamically
        document.addEventListener('DOMContentLoaded', () => {
            leftContent.style.opacity = '0';
            leftContent.style.transform = 'translateY(20px)';
            
            rightCardWrapper.style.opacity = '0';
            rightCardWrapper.style.transform = 'translateY(20px)';

            setTimeout(() => {
                leftContent.style.transition = 'opacity 0.8s ease-out, transform 0.8s ease-out';
                leftContent.style.opacity = '1';
                leftContent.style.transform = 'translateY(0)';

                setTimeout(() => {
                    rightCardWrapper.style.transition = 'opacity 0.8s ease-out, transform 0.8s ease-out';
                    rightCardWrapper.style.opacity = '1';
                    rightCardWrapper.style.transform = 'translateY(0)';
                }, 100);
            }, 50);
        });
    </script>
</body>
</html>
